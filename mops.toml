[package]
name = "backend"
version = "0.1.0"

[build]
outputDir = "src/backend/dist"
args = [ "--release" ]
check-wasm = true
check-deploy = true

[canisters.backend]
main = "src/backend/main.mo"

# `.old/src/backend/dist/backend.most` is the stable signature of the program
# actually deployed on the Caffeine canister (zh6cg-aaaaa-aaaad-aar2q-cai =
# PR #258 build: chain 20260826/27/31 with GameKey on 20260831). Caffeine
# itself writes this file after each of its own builds; a blank `actor { };`
# here (PR #177) hid the real incompatibility for three deploys. Refresh it
# from the live canister (`dfx canister metadata <id> motoko:stable-types`)
# after every successful deploy. Directory `.old/` is gitignored; this file is
# force-tracked. `python3 scripts/check-eop-stables.py` and
# `bash scripts/caffeine-import-gate.sh backend` also check the other
# reconstructed deployed shapes under src/backend/migrations/snapshots/.
[canisters.backend.check-stable]
path = ".old/src/backend/dist/backend.most"

[canisters.backend.migrations]
chain = "src/backend/migrations"
# Must be >= number of chain files so `mops check` keeps the empty-canister
# genesis (20260801, OldActor = {}) and a fresh install still compiles (M0263).
check-limit = 5

[toolchain]
moc = "1.11.2"
lintoko = "0.11.0"

[lint]
extends = true

[moc]
args = [ "-E=M0236,M0235,M0223,M0237", "-W=M0254", "-A=M0198", "--default-persistent-actors", "--implicit-package=core", "-no-check-ir" ]

[dependencies]
core = "2.6.1"
base = "0.16.0"
caffeineai-authorization = "0.1.1"
caffeineai-oql = "0.4.0"
ic = "4.2.0"
